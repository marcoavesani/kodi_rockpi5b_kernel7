# rk3588-media-stack.ini
#
# Config for build_rk3588_media_stack.py
#
# Default install prefix is /usr/local, matching the usual upstream source
# install prefix for FFmpeg, mpv and Kodi. This means executables normally land in:
#   /usr/local/bin/ffmpeg
#   /usr/local/bin/ffprobe
#   /usr/local/bin/mpv
#   /usr/local/bin/kodi
#
# If you want an isolated install, change install_prefix to /opt/v4l2request
# or pass --install-prefix /opt/v4l2request on the command line.

[paths]
build_root = ~/src/rk3588-media-stack
package_output = ~/rk3588-media-stack-debs
install_prefix = /usr/local

[build]
jobs = 0
sudo = sudo

[packages]
# These are pragmatic local binary packages made with fpm.
# They are useful for reinstalling and tracking files with dpkg.
build_debs = yes
install_debs = yes

# If install_direct = yes, the staged tree is also rsync-installed directly.
# Usually leave this off when install_debs = yes.
install_direct = no

deb_iteration = 1
deb_maintainer = local <root@localhost>

[ffmpeg]
repo = https://git.ffmpeg.org/ffmpeg.git

# Upstream FFmpeg release; the patches below are maintained by LibreELEC for this release.
ref = n9.0.2

# Set apply_patch = no only when your FFmpeg repo/branch already contains v4l2request support.
apply_patch = yes

# Patch files are taken from LibreELEC.tv, pinned to a commit for reproducible builds.
# Bump patch_commit together with ref when LibreELEC moves to a new FFmpeg release.
patch_base_url = https://raw.githubusercontent.com/LibreELEC/LibreELEC.tv/{commit}/packages/multimedia/ffmpeg/patches
patch_commit = a1d24cae66825c22ba2d6c6013886347a9f66081

# Applied in this order with GNU patch -p1 (same set LibreELEC uses for RK3588):
#   postproc      libpostproc, removed upstream in FFmpeg 8, still used by Kodi
#   v4l2-request  Kwiboo's V4L2 Request hwaccels (H.264/HEVC/MPEG-2/VP8/VP9/AV1) + VC-1
#   detlev        HEVC ext SPS RPS controls for the RK3588 rkvdec (needs Linux 7.0 UAPI headers)
patches =
    postproc/0001-postproc.patch
    v4l2-request/0001-v4l2-request.patch
    v4l2-request/0002-v4l2-request-vc1.patch
    detlev/0001-hevc-Add-support-for-sps_st_rps-control.patch

# Optional extra patches, applied after the list above: local paths (relative to this file) or URLs.
extra_patches =

# Minimum Linux UAPI header version (/usr/include/linux/version.h) the patches need.
min_kernel_headers = 7.0

package_name = ffmpeg-v4l2request-rockchip

# Space-separated extra configure flags, for example:
# configure_extra = --enable-libdav1d
configure_extra =

[mpv]
repo = https://github.com/mpv-player/mpv.git
ref = v0.41.0

# Upstream mpv has no V4L2 Request hwdec yet. These are the two commits of
# upstream PR https://github.com/mpv-player/mpv/pull/14690 (philipl/mpv
# v4l2request branch), pinned by SHA. They add --hwdec=v4l2request and the
# v4l2request / v4l2request-overlay interops.
patch_base_url = https://github.com/philipl/mpv/commit
patches =
    1800573999b29a145de3eb303a0b51d840a6b3de.patch
    beb3771179b45096702c0b15704bf5b0ca5f9d61.patch
extra_patches =

package_name = mpv-v4l2request-rockchip
libplacebo_package = libplacebo-rockchip

# Space-separated extra Meson options.
meson_extra =

[kodi]
repo = https://github.com/xbmc/xbmc.git
ref = 22.0rc1-Piers

package_name = kodi-v4l2request-rockchip
joystick_package_name = kodi-v4l2request-peripheral-joystick-rockchip

build_joystick_addon = yes

# Space-separated extra CMake options.
# Examples:
# cmake_extra = -DENABLE_INTERNAL_CROSSGUID=ON
cmake_extra =
