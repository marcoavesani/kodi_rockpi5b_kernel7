# rk3588-media-stack.ci.ini
#
# Container/GitHub Actions config.
# This builds local binary .deb packages under /output and installs each package
# inside the container so later components can link against earlier ones.
#
# The install prefix is /usr/local, matching upstream source-install defaults.
# If you prefer Debian-policy-style packages under /usr, change install_prefix
# to /usr and rebuild.

[paths]
build_root = /build/rk3588-media-stack
package_output = /output
install_prefix = /usr/local

[build]
# GitHub public arm64 hosted runners are currently 4 vCPU, so 4 is a safe default.
jobs = 4
sudo = sudo

[packages]
build_debs = yes
install_debs = yes
install_direct = no
deb_iteration = 1
deb_maintainer = local <root@localhost>

[ffmpeg]
repo = https://git.ffmpeg.org/ffmpeg.git
# Upstream FFmpeg release + LibreELEC patch files pinned to a LibreELEC.tv commit.
ref = n9.0.2
# Set apply_patch = no only when using an FFmpeg fork/branch that already contains v4l2request support.
apply_patch = yes
patch_base_url = https://raw.githubusercontent.com/LibreELEC/LibreELEC.tv/{commit}/packages/multimedia/ffmpeg/patches
patch_commit = a1d24cae66825c22ba2d6c6013886347a9f66081
patches =
    postproc/0001-postproc.patch
    v4l2-request/0001-v4l2-request.patch
    v4l2-request/0002-v4l2-request-vc1.patch
    detlev/0001-hevc-Add-support-for-sps_st_rps-control.patch
extra_patches =
min_kernel_headers = 7.0
package_name = ffmpeg-v4l2request-rockchip
configure_extra =

[mpv]
repo = https://github.com/mpv-player/mpv.git
ref = v0.41.0
# V4L2 Request hwdec from upstream mpv PR #14690, pinned by commit SHA.
patch_base_url = https://github.com/philipl/mpv/commit
patches =
    1800573999b29a145de3eb303a0b51d840a6b3de.patch
    beb3771179b45096702c0b15704bf5b0ca5f9d61.patch
extra_patches =
package_name = mpv-v4l2request-rockchip
libplacebo_package = libplacebo-rockchip
meson_extra =

[kodi]
repo = https://github.com/xbmc/xbmc.git
ref = 22.0rc1-Piers
package_name = kodi-v4l2request-rockchip
joystick_package_name = kodi-v4l2request-peripheral-joystick-rockchip
build_joystick_addon = yes
cmake_extra =
